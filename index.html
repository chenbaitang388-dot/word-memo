<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1" />
<title>背单词</title>
<meta name="description" content="离线可用的单词记忆应用：卡片自评、英译中四选一、中文回想拼写，SM-2 间隔重复。" />
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)" />
<meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="背单词" />
<link rel="manifest" href="./manifest.json" />
<link rel="apple-touch-icon" href="./assets/icon-180.png" />
<link rel="icon" href="./assets/icon-192.png" />
<link rel="stylesheet" href="./styles.css" />
</head>
<body>

<div id="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo">词</div>
      <div class="titles">
        <h1 id="viewTitle">学习</h1>
        <p id="viewSub">—</p>
      </div>
    </div>
    <button class="icon-btn" id="btnBackup" title="备份" aria-label="备份" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v11"/><path d="M8 10l4 4 4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
    </button>
  </header>

  <main id="main"><!-- 由 app.js 渲染 --></main>

  <nav class="tabbar" id="tabbar">
    <button data-tab="study" class="on">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3 10h18"/><path d="M8 14h4"/></svg>
      <span>学习</span>
    </button>
    <button data-tab="books">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/><path d="M3 17.5l9 5 9-5"/></svg>
      <span>词库</span>
    </button>
    <button data-tab="stats">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V11"/><path d="M10 20V4"/><path d="M16 20v-6"/><path d="M2.5 20h19"/></svg>
      <span>统计</span>
    </button>
    <button data-tab="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h6"/><path d="M14 7h6"/><path d="M4 12h10"/><path d="M18 12h2"/><path d="M4 17h3"/><path d="M11 17h9"/><circle cx="12" cy="7" r="1.9"/><circle cx="16" cy="12" r="1.9"/><circle cx="9" cy="17" r="1.9"/></svg>
      <span>设置</span>
    </button>
  </nav>
</div>

<div id="toast" class="toast" hidden></div>

<div id="modal" class="modal" hidden>
  <div class="modal-card">
    <h3 id="modalTitle"></h3>
    <p id="modalBody"></p>
    <div class="modal-actions">
      <button class="btn ghost" id="modalCancel">取消</button>
      <button class="btn primary" id="modalOk">好</button>
    </div>
  </div>
</div>

<script type="module" src="./src/app.js"></script>
</body>
</html>
